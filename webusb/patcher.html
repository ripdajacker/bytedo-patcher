<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8BitDo Firmware XUSB ID Patcher</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>8BitDo Firmware XUSB ID Patcher</h1>
    <p>
        Reads an 8BitDo controller firmware update (<code>.dat</code>) file, lets you
        patch the 4-byte XUSB ID, and recomputes the embedded CRC32 so the result
        validates. Mirrors <code>xusb_id_patcher.py</code>.
    </p>

    <div class="pure-g">
        <div class="pure-u-1 pure-u-md-1-2">
            <fieldset>
                <legend>Firmware update file</legend>
                <label>
                    Firmware file:
                    <input type="file" id="file" accept=".dat">
                </label>
                <label>
                    Expected XID (hex, e.g. <code>52180684</code>; defaults to stock):
                    <input type="text" id="expected" value="52180684" size="8">
                </label>
                <button id="show" class="pure-button pure-button-primary">Show</button>
            </fieldset>

            <fieldset>
                <legend>Patch</legend>
                <label>
                    New XID (hex, e.g. <code>cafebabe</code>):
                    <input type="text" id="newxid" value="cafebabe" size="8">
                </label>
                <button id="patch" class="pure-button pure-button-primary">Patch and download</button>
            </fieldset>
        </div>

        <div class="pure-u-1 pure-u-md-1-2">
            <h2>Output</h2>
            <pre id="output">Load a .dat file.</pre>
        </div>
    </div>

    <script src="pat.js"></script>
    <footer>© Jesenko Mehmedbasic</footer>
</body>
</html>
