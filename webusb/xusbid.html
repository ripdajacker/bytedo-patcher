<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8BitDo XUSB ID</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pure-g">
        <div class="pure-u-1 pure-u-md-2-3">
            <h1>8BitDo XUSB ID Reader</h1>
            <p>Queries the MS-specific Get_Device_ID request to read the 4-byte XUSB ID from the controller.</p>
            <button id="connect" class="pure-button pure-button-primary">Connect to controller</button>
            <h2>Result</h2>
            <pre id="output">Not connected.</pre>
        </div>
    </div>

    <script src="app.js"></script>
    <footer>© Jesenko Mehmedbasic</footer>
</body>
</html>
